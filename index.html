<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arab AI - منصة الذكاء الاصطناعي العربية</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
            color: #e6edf3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            max-width: 800px;
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            color: #76b900;
            text-shadow: 0 0 20px rgba(118, 185, 0, 0.5);
        }
        
        p {
            font-size: 1.3em;
            color: #8b949e;
            margin-bottom: 30px;
        }
        
        .status {
            background: #161b22;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #76b900;
            margin-top: 30px;
        }
        
        .status h2 {
            color: #76b900;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Arab AI</h1>
        <p>منصة الذكاء الاصطناعي العربية للبرمجة</p>
        
        <div class="status">
            <h2>✅ الموقع يعمل بنجاح!</h2>
            <p>جاري بناء المنصة الكاملة...</p>
        </div>
    </div>
</body>
</html>
