<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arab AI - منصة الذكاء الاصطناعي العربية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- الشريط الجانبي -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="newChat()">
                <span>+</span> محادثة جديدة
            </button>
        </div>
        <div class="sidebar-section">
            <div class="section-title">اليوم</div>
            <div class="chat-list" id="chat-list">
                <div class="chat-item active">
                    <span>💬 محادثة جديدة</span>
                </div>
            </div>
        </div>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar">👤</div>
                <span>مستخدم</span>
            </div>
        </div>
    </aside>

    <!-- المحتوى الرئيسي -->
    <main class="main-content">
        <!-- شريط علوي -->
        <header class="top-bar">
            <div class="model-selector">
                <select id="model-select">
                    <option value="meta/llama-3.1-70b-instruct">🧠 Llama 3.1 70B</option>
                    <option value="meta/codellama-70b-instruct">💻 CodeLlama 70B</option>
                    <option value="nvidia/nemotron-4-340b-instruct">⚡ Nemotron 340B</option>
                    <option value="deepseek-ai/deepseek-coder-6.7b-base">🎯 DeepSeek Coder</option>
                </select>
            </div>
            <div class="top-actions">
                <button class="icon-btn" title="مشاركة">🔗</button>
                <button class="icon-btn" title="إعدادات">⚙️</button>
            </div>
        </header>

        <!-- منطقة المحادثة -->
        <div class="chat-area" id="chat-area">
            <!-- شاشة الترحيب -->
            <div class="welcome-screen" id="welcome-screen">
                <div class="welcome-logo">
                    <div class="logo-circle">🤖</div>
                    <h1>Arab AI</h1>
                    <p>مساعدك الذكي للبرمجة - مدعوم بتقنية NVIDIA</p>
                </div>
                
                <div class="suggestions-grid">
                    <button class="suggestion-card" onclick="useSuggestion('اشرح لي مفهوم الـ Object Oriented Programming في Python مع أمثلة')">
                        <div class="suggestion-icon">🐍</div>
                        <div class="suggestion-text">
                            <strong>شرح OOP في Python</strong>
                            <span>مفاهيم البرمجة الكائنية</span>
                        </div>
                    </button>
                    
                    <button class="suggestion-card" onclick="useSuggestion('اكتب دالة JavaScript للتحقق من صحة البريد الإلكتروني')">
                        <div class="suggestion-icon">📧</div>
                        <div class="suggestion-text">
                            <strong>التحقق من البريد الإلكتروني</strong>
                            <span>كود JavaScript جاهز</span>
                        </div>
                    </button>
                    
                    <button class="suggestion-card" onclick="useSuggestion('ما الفرق بين REST API و GraphQL؟')">
                        <div class="suggestion-icon">🌐</div>
                        <div class="suggestion-text">
                            <strong>REST vs GraphQL</strong>
                            <span>مقارنة تقنية شاملة</span>
                        </div>
                    </button>
                    
                    <button class="suggestion-card" onclick="useSuggestion('ساعدني في بناء تطبيق React من الصفر')">
                        <div class="suggestion-icon">⚛️</div>
                        <div class="suggestion-text">
                            <strong>بناء تطبيق React</strong>
                            <span>خطوة بخطوة</span>
                        </div>
                    </button>
                </div>
            </div>

            <!-- رسائل المحادثة -->
            <div class="messages-container" id="messages-container"></div>
        </div>

        <!-- منطقة الإدخال -->
        <div class="input-area">
            <div class="input-container">
                <div class="input-wrapper">
                    <textarea 
                        id="user-input" 
                        placeholder="اسأل Arab AI عن أي شيء في البرمجة..."
                        rows="1"
                        oninput="autoResize(this)"
                        onkeydown="handleKey(event)"
                    ></textarea>
                    <button class="send-btn" id="send-btn" onclick="sendMessage()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M7 11L12 6L17 11M12 18V7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
                <div class="input-footer">
                    <span>Arab AI يمكن أن يخطئ. تحقق من المعلومات المهمة.</span>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
