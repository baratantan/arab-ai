<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Arab AI</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#000;--side:#171717;--hover:#212121;--btn:#2f2f2f;--text:#ececec;--text2:#b4b4b4;--text3:#8e8ea0;--blue:#10a37f;--purple:#a78bfa;--border:#2f2f2f;--danger:#ef4444}
html,body{height:100%;overflow:hidden}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);direction:rtl}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99;opacity:0;visibility:hidden;transition:.3s}
.overlay.on{opacity:1;visibility:visible}
.sidebar{position:fixed;top:0;right:0;width:300px;max-width:85vw;height:100vh;background:var(--side);z-index:100;transform:translateX(100%);transition:.3s;display:flex;flex-direction:column;padding:10px}
.sidebar.on{transform:translateX(0)}
.side-head{display:flex;align-items:center;gap:10px;padding:8px 4px 12px}
.side-title{flex:1;font-size:18px;font-weight:700}
.cbtn{width:40px;height:40px;border-radius:50%;background:var(--btn);border:none;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0}
.cbtn:hover{background:var(--hover)}
.cbtn svg{width:20px;height:20px}

.menu{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.mitem{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer;color:var(--text2);font-size:14px;transition:.2s}
.mitem:hover{background:var(--hover);color:var(--text)}
.mitem svg{width:22px;height:22px;flex-shrink:0}

.divider{height:1px;background:var(--border);margin:6px 0}
.history{flex:1;overflow-y:auto;padding:4px 0}
.hitem{padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--text2);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hitem:hover{background:var(--hover);color:var(--text)}
.hitem.active{background:var(--hover);color:var(--text)}
.hitem .hname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hitem .hdel{opacity:0;color:var(--danger);transition:.2s;font-size:16px}
.hitem:hover .hdel{opacity:1}

.side-foot{border-top:1px solid var(--border);padding-top:10px;margin-top:6px;display:flex;flex-direction:column;gap:8px}
.newbtn{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--blue);color:#fff;border-radius:10px;cursor:pointer;border:none;font-family:inherit;font-size:14px;font-weight:600}
.newbtn:hover{opacity:.9}
.newbtn svg{width:18px;height:18px}
.user{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:14px}
.user:hover{background:var(--hover)}
.uav{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#ff6b9d,#c44569);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff}

.main{height:100vh;display:flex;flex-direction:column;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:10px}
.top-title{font-size:16px;font-weight:700;flex:1;text-align:center}
.plus{background:#2d3748;border:none;color:var(--text);padding:8px 14px;border-radius:24px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:.2s}
.plus:hover{background:#3a4558}
.plus svg{width:16px;height:16px;color:var(--purple)}

.sec{display:none;flex:1;overflow-y:auto;padding:20px 16px 140px}
.sec.on{display:block}
.sec::-webkit-scrollbar{width:4px}
.sec::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.welcome{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:100%;padding-bottom:30px}
.acts{display:flex;flex-direction:column;gap:10px;width:100%;max-width:600px}
.act{display:flex;align-items:center;gap:14px;padding:14px 16px;background:transparent;border:none;color:var(--text2);font-family:inherit;font-size:15px;cursor:pointer;text-align:right;transition:.2s}
.act:hover{color:var(--text)}
.act svg{width:24px;height:24px;flex-shrink:0;color:var(--text3)}

.msgs{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.msg{display:flex;gap:12px;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.mav{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:700;color:#fff}
.msg.u .mav{background:#5a5a5a}
.msg.a .mav{background:var(--blue)}
.mcnt{flex:1;line-height:1.7;font-size:15px;padding-top:3px;min-width:0}
.msg.u .mcnt{background:var(--btn);padding:10px 14px;border-radius:18px;display:inline-block;max-width:85%}
.mcnt p{margin-bottom:10px}
.mcnt p:last-child{margin-bottom:0}
.mcnt pre{background:#1e1e1e;border:1px solid var(--border);border-radius:10px;padding:12px;overflow-x:auto;margin:10px 0;direction:ltr;text-align:left;font-family:monospace;font-size:13px}
.mcnt code{font-family:monospace;font-size:13px}
.mcnt p code{background:var(--btn);padding:2px 6px;border-radius:4px}
.mcnt ul,.mcnt ol{margin:10px 20px}
.mcnt li{margin-bottom:6px}
.mcnt strong{color:var(--blue)}
.mcnt h2,.mcnt h3{margin:14px 0 8px}

/* أزرار التحكم بالرد */
.msg-actions{display:flex;gap:4px;margin-top:8px;opacity:0;transition:.2s}
.msg:hover .msg-actions{opacity:1}
.msg-actions button{width:32px;height:32px;border-radius:6px;background:transparent;border:none;color:var(--text3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.msg-actions button:hover{background:var(--btn);color:var(--text)}
.msg-actions button svg{width:16px;height:16px}

.typing{display:flex;gap:4px;padding:8px 0}
.typing span{width:7px;height:7px;background:var(--text3);border-radius:50%;animation:b 1.4s infinite}
.typing span:nth-child(1){animation-delay:-.32s}
.typing span:nth-child(2){animation-delay:-.16s}
@keyframes b{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}

.tool{max-width:720px;margin:0 auto}
.tool h2{font-size:22px;margin-bottom:8px;color:var(--blue)}
.tool>p{color:var(--text3);font-size:14px;margin-bottom:20px}
.ig{margin-bottom:16px}
.ig label{display:block;margin-bottom:8px;color:var(--text2);font-size:14px;font-weight:600}
.ig textarea,.ig select{width:100%;background:var(--side);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:12px;font-family:inherit;font-size:14px;resize:vertical}
.ig textarea:focus,.ig select:focus{outline:none;border-color:var(--blue)}
.ci{direction:ltr;text-align:left;font-family:monospace;font-size:13px}
.pbtn{width:100%;background:var(--blue);color:#fff;border:none;padding:12px;border-radius:10px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:.2s}
.pbtn:hover{opacity:.9}
.out{margin-top:20px;background:var(--side);border:1px solid var(--border);border-radius:12px;padding:16px;min-height:100px;line-height:1.7}
.out pre{background:#1e1e1e;border-radius:8px;padding:10px;overflow-x:auto;margin:10px 0;direction:ltr;text-align:left;font-family:monospace;font-size:13px}

.insec{position:absolute;bottom:0;left:0;right:0;padding:12px 16px 20px;background:linear-gradient(to top,var(--bg) 60%,transparent)}
.inbar{max-width:720px;margin:0 auto;background:var(--btn);border-radius:28px;padding:8px 8px 8px 14px;display:flex;align-items:flex-end;gap:6px}
.iic{width:36px;height:36px;border-radius:50%;background:transparent;border:none;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s}
.iic:hover{color:var(--text)}
.iic svg{width:22px;height:22px}
.inbar textarea{flex:1;background:transparent;border:none;color:var(--text);font-family:inherit;font-size:15px;resize:none;outline:none;max-height:200px;line-height:1.5;padding:8px 0}
.inbar textarea::placeholder{color:var(--text3)}
.sbtn{width:36px;height:36px;border-radius:50%;background:var(--text);border:none;color:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s}
.sbtn:hover:not(:disabled){background:var(--blue);color:#fff}
.sbtn:disabled{opacity:.3;cursor:not-allowed}
.sbtn svg{width:20px;height:20px}
.disc{max-width:720px;margin:10px auto 0;text-align:center;font-size:12px;color:var(--text3)}

/* نافذة الإعدادات */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modal-box{background:var(--side);border-radius:16px;padding:24px;width:100%;max-width:500px;max-height:85vh;overflow-y:auto}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-head h3{font-size:20px}
.modal-close{background:var(--btn);border:none;color:var(--text);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px}
.setting-item{padding:14px 0;border-bottom:1px solid var(--border)}
.setting-item:last-child{border:none}
.setting-item label{display:block;margin-bottom:8px;font-weight:600}
.setting-item select,.setting-item input[type=text]{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:10px;font-family:inherit}

.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--blue);color:#fff;padding:10px 20px;border-radius:24px;font-size:14px;z-index:300;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}

@media(min-width:768px){
.sidebar{transform:translateX(0);position:relative;width:260px;max-width:none}
.overlay{display:none}
body{display:flex}
.main{flex:1}
.msg-actions{opacity:1}
}
</style>
</head>
<body>

<div class="overlay" id="ov" onclick="togSide()"></div>
<aside class="sidebar" id="sb">
  <div class="side-head">
    <button class="cbtn" onclick="togSide()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
    <h2 class="side-title">Arab AI</h2>
    <button class="cbtn" onclick="openSettings()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.604.852.997 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>
  <div class="menu">
    <div class="mitem" onclick="goSec('chat',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>المحادثة</span></div>
    <div class="mitem" onclick="goSec('gen',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg><span>توليد الأكواد</span></div>
    <div class="mitem" onclick="goSec('rev',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg><span>مراجعة الأكواد</span></div>
    <div class="mitem" onclick="goSec('dbg',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4m0 4h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg><span>كشف الأخطاء</span></div>
  </div>
  <div class="divider"></div>
  <div class="history" id="hist"></div>
  <div class="side-foot">
    <button class="newbtn" onclick="newChat()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg><span>دردشة جديدة</span></button>
    <div class="user"><div class="uav">م</div><span>مستخدم</span></div>
  </div>
</aside>

<main class="main">
  <header class="top">
    <button class="cbtn" onclick="togSide()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></button>
    <div class="top-title" id="topTitle">Arab AI</div>
    <button class="plus"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/></svg><span>Plus</span></button>
  </header>

  <section class="sec on" id="chat">
    <div class="welcome" id="welc">
      <div class="acts">
        <button class="act" onclick="useS('اشرح لي OOP في Python مع أمثلة')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><span>شرح OOP في Python</span></button>
        <button class="act" onclick="useS('اكتب دالة JavaScript للتحقق من البريد الإلكتروني')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg><span>التحقق من البريد الإلكتروني</span></button>
        <button class="act" onclick="useS('ما الفرق بين REST API و GraphQL؟')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20z"/></svg><span>REST vs GraphQL</span></button>
        <button class="act" onclick="useS('ساعدني في بناء تطبيق React من الصفر')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg><span>بناء تطبيق React</span></button>
      </div>
    </div>
    <div class="msgs" id="msgs"></div>
  </section>

  <section class="sec" id="gen">
    <div class="tool">
      <h2>⚡ توليد الأكواد</h2>
      <p>صف ما تريد وسأكتب الكود لك</p>
      <div class="ig"><label>وصف المطلوب:</label><textarea id="gp" rows="4" placeholder="مثال: دالة بايثون لقراءة CSV"></textarea></div>
      <div class="ig"><label>لغة البرمجة:</label><select id="gl"><option>Python</option><option>JavaScript</option><option>Java</option><option>C++</option><option>PHP</option></select></div>
      <button class="pbtn" onclick="genCode()">توليد الكود</button>
      <div class="out" id="go"></div>
    </div>
  </section>

  <section class="sec" id="rev">
    <div class="tool">
      <h2>🔍 مراجعة الأكواد</h2>
      <p>الصق كودك وسأحلله وأقترح تحسينات</p>
      <div class="ig"><label>الكود:</label><textarea id="rc" class="ci" rows="10" placeholder="الصق الكود هنا..."></textarea></div>
      <button class="pbtn" onclick="revCode()">مراجعة الكود</button>
      <div class="out" id="ro"></div>
    </div>
  </section>

  <section class="sec" id="dbg">
    <div class="tool">
      <h2>🐛 كشف الأخطاء</h2>
      <p>الصق الكود ورسالة الخطأ وسأساعدك</p>
      <div class="ig"><label>الكود:</label><textarea id="dc" class="ci" rows="8" placeholder="الصق الكود..."></textarea></div>
      <div class="ig"><label>رسالة الخطأ (اختياري):</label><textarea id="de" rows="3" placeholder="رسالة الخطأ..."></textarea></div>
      <button class="pbtn" onclick="dbgCode()">تحليل وإصلاح</button>
      <div class="out" id="do"></div>
    </div>
  </section>

  <div class="insec">
    <div class="inbar">
      <button class="iic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
      <textarea id="inp" placeholder="اسأل Arab AI" rows="1" oninput="autoR(this)" onkeydown="hKey(event)"></textarea>
      <button class="iic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></button>
      <button class="sbtn" id="sbtn" onclick="send()" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
    <div class="disc">يمكن لـ Arab AI أن يخطئ. تحقق من المعلومات المهمة.</div>
  </div>
</main>

<!-- نافذة الإعدادات -->
<div class="modal" id="settingsModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3>⚙️ الإعدادات</h3>
      <button class="modal-close" onclick="closeSettings()">✕</button>
    </div>
    <div class="setting-item">
      <label> المظهر</label>
      <select><option>داكن (افتراضي)</option><option>فاتح</option><option>تلقائي</option></select>
    </div>
    <div class="setting-item">
      <label>🌐 اللغة</label>
      <select><option>العربية</option><option>English</option></select>
    </div>
    <div class="setting-item">
      <label> نموذج الذكاء الاصطناعي</label>
      <select><option>Llama 3.1 70B</option><option>CodeLlama 70B</option><option>Nemotron 340B</option><option>DeepSeek Coder</option></select>
    </div>
    <div class="setting-item">
      <label>📝 التعليمات المخصصة</label>
      <input type="text" placeholder="مثال: أجب باختصار، استخدم أمثلة...">
    </div>
    <div class="setting-item">
      <label>🔒 الخصوصية</label>
      <select><option>حفظ المحادثات</option><option>عدم الحفظ (خصوصية عالية)</option></select>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let busy=false,chats=JSON.parse(localStorage.getItem('arabai_chats')||'[]'),curId=null;

function autoR(t){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,200)+'px';document.getElementById('sbtn').disabled=!t.value.trim()}
function hKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}
function togSide(){document.getElementById('sb').classList.toggle('on');document.getElementById('ov').classList.toggle('on')}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2000)}

function openSettings(){document.getElementById('settingsModal').classList.add('on')}
function closeSettings(){document.getElementById('settingsModal').classList.remove('on')}

function goSec(id,el){
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  document.querySelectorAll('.mitem').forEach(m=>m.classList.remove('active'));
  if(el)el.classList.add('active');
  const titles={chat:'Arab AI',gen:'توليد الأكواد',rev:'مراجعة الأكواد',dbg:'كشف الأخطاء'};
  document.getElementById('topTitle').textContent=titles[id];
  if(window.innerWidth<768)togSide();
}

function saveChats(){localStorage.setItem('arabai_chats',JSON.stringify(chats))}
function renderHist(){
  const h=document.getElementById('hist');
  if(chats.length===0){h.innerHTML='<div class="hitem"><span class="hname">لا توجد محادثات</span></div>';return}
  h.innerHTML=chats.map(c=>`<div class="hitem ${c.id===curId?'active':''}" onclick="loadChat('${c.id}')"><span class="hname">${c.name}</span><span class="hdel" onclick="event.stopPropagation();delChat('${c.id}')">🗑</span></div>`).join('');
}

function newChat(){
  curId=null;
  document.getElementById('msgs').innerHTML='';
  document.getElementById('welc').style.display='flex';
  document.getElementById('topTitle').textContent='Arab AI';
  renderHist();
  if(window.innerWidth<768)togSide();
}

function loadChat(id){
  const c=chats.find(x=>x.id===id);
  if(!c)return;
  curId=id;
  document.getElementById('welc').style.display='none';
  const m=document.getElementById('msgs');
  m.innerHTML='';
  c.msgs.forEach(x=>addMsg(x.text,x.role,false));
  document.getElementById('topTitle').textContent=c.name;
  renderHist();
  if(window.innerWidth<768)togSide();
}

function delChat(id){
  chats=chats.filter(x=>x.id!==id);
  if(curId===id)newChat();
  else{saveChats();renderHist()}
  toast('تم حذف المحادثة');
}

function useS(t){document.getElementById('inp').value=t;autoR(document.getElementById('inp'));send()}

function send(){
  if(busy)return;
  const inp=document.getElementById('inp');
  const m=inp.value.trim();
  if(!m)return;
  busy=true;
  if(!curId){
    curId='c'+Date.now();
    chats.unshift({id:curId,name:m.substring(0,30),msgs:[]});
  }
  const chat=chats.find(x=>x.id===curId);
  chat.msgs.push({text:m,role:'u'});
  chat.name=m.substring(0,30);
  
  document.getElementById('welc').style.display='none';
  addMsg(m,'u');
  inp.value='';inp.style.height='auto';
  document.getElementById('sbtn').disabled=true;
  const tid=addTyp();
  setTimeout(()=>{
    rmTyp(tid);
    const r=aiReply(m);
    chat.msgs.push({text:r,role:'a'});
    addMsg(r,'a',true);
    saveChats();renderHist();
    busy=false;
  },1000);
}

function addMsg(t,r,withActions=true){
  const c=document.getElementById('msgs');
  const d=document.createElement('div');
  d.className='msg '+r;
  const av=r==='u'?'م':'';
  let actions='';
  if(r==='a'&&withActions){
    actions=`<div class="msg-actions">
      <button onclick="copyMsg(this)" title="نسخ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
      <button onclick="regenMsg(this)" title="إعادة توليد"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg></button>
      <button onclick="rateMsg(this,1)" title="إعجاب"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg></button>
      <button onclick="rateMsg(this,-1)" title="عدم إعجاب"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/></svg></button>
      <button onclick="shareMsg(this)" title="مشاركة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></button>
    </div>`;
  }
  d.innerHTML=`<div class="mav">${av}</div><div class="mcnt">${t}${actions}</div>`;
  c.appendChild(d);
  const sc=document.getElementById('chat');sc.scrollTop=sc.scrollHeight;
}

function addTyp(){
  const c=document.getElementById('msgs');
  const id='t'+Date.now();
  const d=document.createElement('div');
  d.className='msg a';d.id=id;
  d.innerHTML=`<div class="mav"></div><div class="mcnt"><div class="typing"><span></span><span></span><span></span></div></div>`;
  c.appendChild(d);
  return id;
}
function rmTyp(id){const e=document.getElementById(id);if(e)e.remove()}

function copyMsg(btn){
  const text=btn.closest('.mcnt').childNodes[0].textContent;
  navigator.clipboard.writeText(text).then(()=>toast('✅ تم النسخ'));
}
function regenMsg(btn){
  const msgDiv=btn.closest('.msg');
  const tid=addTyp();
  setTimeout(()=>{
    rmTyp(tid);
    msgDiv.querySelector('.mcnt').innerHTML=aiReply('إعادة توليد')+'<div class="msg-actions">'+btn.closest('.msg-actions').outerHTML+'</div>';
    toast('🔄 تم إعادة التوليد');
  },800);
}
function rateMsg(btn,v){btn.style.color=v>0?'var(--blue)':'var(--danger)';toast(v>0?'👍 شكراً لتقييمك':'👎 سنحاول التحسن')}
function shareMsg(btn){
  const url=window.location.href;
  navigator.clipboard.writeText(url).then(()=>toast('🔗 تم نسخ الرابط'));
}

function aiReply(m){
  const l=m.toLowerCase();
  if(l.includes('python')||l.includes('بايثون'))return`<h3>🐍 Python</h3><p>Python لغة برمجة عالية المستوى، سهلة التعلم وقوية.</p><pre>def greet(name):\n    return f"مرحباً {name}!"\n\nprint(greet("Arab AI"))</pre><p><strong>المميزات:</strong> سهلة القراءة، مكتبات ضخمة، تستخدم في الذكاء الاصطناعي.</p>`;
  if(l.includes('javascript')||l.includes('جافا'))return`<h3> JavaScript</h3><p>JavaScript لغة الويب الأساسية.</p><pre>const arabAI = {\n  name: "Arab AI",\n  greet: () => "مرحباً!"\n};\nconsole.log(arabAI.greet());</pre>`;
  if(l.includes('oop')||l.includes('كائنية'))return`<h3>🎯 البرمجة الكائنية (OOP)</h3><p>OOP نمط برمجة ينظم الكود في <strong>كائنات</strong>.</p><pre>class Animal:\n    def __init__(self, name):\n        self.name = name\n    def speak(self):\n        pass\n\nclass Dog(Animal):\n    def speak(self):\n        return f"{self.name}: Woof!"\n\ndog = Dog("Rex")\nprint(dog.speak())</pre><p><strong>المبادئ الأربعة:</strong> التغليف، الوراثة، تعدد الأشكال، التجريد.</p>`;
  if(l.includes('react'))return`<h3>⚛️ بناء تطبيق React</h3><p>الخطوات:</p><pre>npx create-react-app my-app\ncd my-app\nnpm start</pre><pre>function App() {\n  return &lt;h1&gt;مرحباً Arab AI!&lt;/h1&gt;;\n}</pre>`;
  if(l.includes('rest')||l.includes('graphql'))return`<h3>🌐 REST vs GraphQL</h3><table style="width:100%;border-collapse:collapse;margin:10px 0"><tr style="background:var(--btn)"><th style="padding:8px;border:1px solid var(--border)">المعيار</th><th style="padding:8px;border:1px solid var(--border)">REST</th><th style="padding:8px;border:1px solid var(--border)">GraphQL</th></tr><tr><td style="padding:8px;border:1px solid var(--border)">البنية</td><td style="padding:8px;border:1px solid var(--border)">Endpoints متعددة</td><td style="padding:8px;border:1px solid var(--border)">Endpoint واحد</td></tr><tr><td style="padding:8px;border:1px solid var(--border)">البيانات</td><td style="padding:8px;border:1px solid var(--border)">ثابتة</td><td style="padding:8px;border:1px solid var(--border)">مرنة حسب الطلب</td></tr></table>`;
  return`<p>شكراً لسؤالك! هذا رد تجريبي.</p><p>سؤالك: <em>"${m}"</em></p><p>قريباً سنربط الموقع بـ <strong>NVIDIA AI</strong> لردود حقيقية من نماذج مثل Llama 3.1 و CodeLlama.</p>`;
}

function genCode(){
  const p=document.getElementById('gp').value.trim();
  const l=document.getElementById('gl').value;
  const o=document.getElementById('go');
  if(!p){o.innerHTML='<p style="color:var(--danger)">أدخل وصفاً أولاً</p>';return}
  o.innerHTML='<div class="typing"><span></span><span></span><span></span></div>';
  setTimeout(()=>{
    const code=l==='Python'?`def analyze_csv(file):\n    import csv\n    data = []\n    with open(file, 'r') as f:\n        reader = csv.DictReader(f)\n        for row in reader:\n            data.append(row)\n    return data`:`function validate(email) {\n  const re = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;\n  return re.test(email);\n}`;
    o.innerHTML=`<p>✅ تم توليد الكود بلغة <strong>${l}</strong>:</p><pre>${code}</pre><p>📝 <strong>الشرح:</strong> الكود يحقق المطلوب. يمكنك تعديله حسب احتياجك.</p>`;
  },800);
}

function revCode(){
  const c=document.getElementById('rc').value.trim();
  const o=document.getElementById('ro');
  if(!c){o.innerHTML='<p style="color:var(--danger)">أدخل كوداً أولاً</p>';return}
  o.innerHTML='<div class="typing"><span></span><span></span><span></span></div>';
  setTimeout(()=>{
    o.innerHTML=`<h3>🔍 نتائج المراجعة</h3><p>✅ <strong>جودة الكود:</strong> جيدة بشكل عام</p><p>⚠️ <strong>ملاحظات:</strong></p><ul><li>أضف تعليقات توضيحية</li><li>استخدم أسماء متغيرات واضحة</li><li>أضف معالجة للأخطاء</li></ul><p>💡 <strong>اقتراحات:</strong> قسّم الكود إلى دوال أصغر، واستخدم ثوابت بدلاً من القيم السحرية.</p>`;
  },1000);
}

function dbgCode(){
  const c=document.getElementById('dc').value.trim();
  const o=document.getElementById('do');
  if(!c){o.innerHTML='<p style="color:var(--danger)">أدخل كوداً أولاً</p>';return}
  o.innerHTML='<div class="typing"><span></span><span></span><span></span></div>';
  setTimeout(()=>{
    o.innerHTML=`<h3>🐛 تحليل الخطأ</h3><p>🔴 <strong>نوع الخطأ:</strong> خطأ منطقي</p><p>📍 <strong>الموقع:</strong> السطر 3 تقريباً</p><p>💡 <strong>السبب:</strong> المتغير لم يُعرّف بشكل صحيح</p><p>✅ <strong>الحل:</strong></p><pre>def correct():\n    result = 0\n    for i in range(10):\n        result += i\n    return result</pre><p>📚 <strong>لتجنبه:</strong> تأكد من تعريف جميع المتغيرات قبل استخدامها.</p>`;
  },1000);
}

renderHist();
